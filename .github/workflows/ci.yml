name: CI
# Verification only: this workflow never publishes an image or changes an environment.
on: {pull_request: {}, push: {branches: [main]}}
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 8.0.x}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
        working-directory: src/CertificateManager.Web
      - run: npm run lint && npm run build
        working-directory: src/CertificateManager.Web
      - run: dotnet restore && dotnet build --no-restore -c Release && dotnet test --no-build -c Release
      # Rendering idempotent SQL catches migration discovery/model failures without connecting to a database.
      - run: dotnet tool restore && dotnet ef migrations script --idempotent --no-build -c Release --project src/CertificateManager.Infrastructure --startup-project src/CertificateManager.Api --output ${{ runner.temp }}/certmanager-migrations.sql
      # Final packaging check: also verifies that the frontend is embedded in the runtime image.
      - run: docker build -t certmanager:ci .
