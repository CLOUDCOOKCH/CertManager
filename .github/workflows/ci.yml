name: CI
on: {pull_request: {}, push: {branches: [main]}}
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: 8.0.x}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: src/CertificateManager.Web/package-lock.json}
      - run: npm install
        working-directory: src/CertificateManager.Web
      - run: npm run lint && npm run build
        working-directory: src/CertificateManager.Web
      - run: dotnet restore && dotnet build --no-restore -c Release && dotnet test --no-build -c Release
      - run: docker build -t certmanager:ci .
