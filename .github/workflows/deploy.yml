name: Deploy Azure
on: {workflow_dispatch: {inputs: {environment: {description: Environment, required: true, default: dev, type: choice, options: [dev, test, prod]}}}, push: {branches: [main]}}
permissions: {id-token: write, contents: read}
jobs:
  deploy:
    environment: ${{ inputs.environment || 'prod' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: {client-id: "${{ vars.AZURE_CLIENT_ID }}", tenant-id: "${{ vars.AZURE_TENANT_ID }}", subscription-id: "${{ vars.AZURE_SUBSCRIPTION_ID }}"}
      - uses: azure/cli@v2
        with: {inlineScript: "az group create -n ${{ vars.AZURE_RESOURCE_GROUP }} -l ${{ vars.AZURE_LOCATION }} && az deployment group create -g ${{ vars.AZURE_RESOURCE_GROUP }} -f infrastructure/bicep/main.bicep -p environmentName=${{ inputs.environment || 'prod' }} postgresAdminLogin=${{ vars.POSTGRES_ADMIN_LOGIN }} postgresAdminPassword='${{ secrets.POSTGRES_ADMIN_PASSWORD }}' imageTag=${{ github.sha }}"}
      - run: az acr login -n ${{ vars.AZURE_ACR_NAME }} && docker build -t ${{ vars.AZURE_ACR_NAME }}.azurecr.io/certmanager:${{ github.sha }} . && docker push ${{ vars.AZURE_ACR_NAME }}.azurecr.io/certmanager:${{ github.sha }}
      - run: az webapp config container set -g ${{ vars.AZURE_RESOURCE_GROUP }} -n ${{ vars.AZURE_WEBAPP_NAME }} --docker-custom-image-name ${{ vars.AZURE_ACR_NAME }}.azurecr.io/certmanager:${{ github.sha }}
